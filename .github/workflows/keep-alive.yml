name: Keep-alive ping

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://idlib-smart-platform-api.onrender.com/v1/health)
          echo "Health endpoint responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            exit 1
          fi
